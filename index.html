<style>
/* Layout: one narrow centered column, four full-width link rows, platform color only on each icon tile */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --fg: #14171f;
  --muted: #5b6475;
  --line: #d9dee8;
  --focus: #1f4fd8;
  --yt: #e5322d;
  --tt: #111318;
  --ig: #d6336c;
  --fb: #1877f2;
  --on-tile: #ffffff;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218;
    --surface: #1a1f29;
    --fg: #eef1f7;
    --muted: #9aa4b6;
    --line: #2b3240;
    --focus: #7da0ff;
    --tt: #2c3340;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218;
  --surface: #1a1f29;
  --fg: #eef1f7;
  --muted: #9aa4b6;
  --line: #2b3240;
  --focus: #7da0ff;
  --tt: #2c3340;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 56px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { width: 100%; max-width: 460px; margin-inline: auto; }
h1 {
  font-family: var(--font-display);
  font-size: clamp(2rem, 8vw, 2.75rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0 0 12px;
  text-wrap: balance;
}
.intro { color: var(--muted); font-size: 1rem; line-height: 1.5; margin: 0 0 32px; max-width: 34ch; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.link {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition: transform .15s ease, border-color .15s ease;
}
a.link:hover { transform: translateY(-2px); border-color: var(--fg); }
a.link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.tile {
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--on-tile);
}
.tile svg { width: 24px; height: 24px; fill: currentColor; }
.tile.yt { background: var(--yt); }
.tile.tt { background: var(--tt); }
.tile.ig { background: var(--ig); }
.tile.fb { background: var(--fb); }
.text { min-width: 0; flex: 1; }
.name { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.125rem; }
.what { display: block; color: var(--muted); font-size: .875rem; margin-top: 2px; }
.arrow { flex: none; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { a.link { transition: none; } a.link:hover { transform: none; } }
</style>
